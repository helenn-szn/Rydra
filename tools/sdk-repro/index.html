<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; media-src blob:;">
  <title>SmartSpectra repro</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; color: #111418; background: #f4f5f7; }
    h1 { font-size: 20px; margin: 0 0 4px; } p { margin: 4px 0; color: #5b6168; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin: 14px 0; }
    label { display: grid; gap: 4px; font-size: 13px; color: #5b6168; }
    select, input, button { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 8px; border: 1px solid #d5d9de; background: #fff; color: #111418; }
    button { background: #111418; color: #fff; border: 0; padding: 9px 18px; cursor: pointer; }
    video { width: 480px; max-width: 100%; border-radius: 12px; background: #15181c; transform: scaleX(-1); }
    #stats { font: 13px/1.6 ui-monospace, monospace; background: #fff; border-radius: 10px; padding: 10px 14px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>SmartSpectra repro</h1>
  <p>One timed check with the SmartSpectra SDK only, logging every step of the ending. Watch the terminal.</p>
  <div class="row">
    <label>Camera <select id="cam"></select></label>
    <label>Size <select id="size"><option value="480x360" selected>480×360 (Rydra default)</option><option value="640x480">640×480</option><option value="320x240">320×240</option></select></label>
    <label>Measurements <select id="metrics"><option value="full" selected>Breathing + pulse + HRV (Rydra)</option><option value="pulse">Breathing + pulse</option><option value="breathing">Breathing only</option></select></label>
    <label>Seconds <input id="secs" type="number" value="60" min="10" max="120" style="width:80px"></label>
    <button id="go">Start check</button>
  </div>
  <video id="video" autoplay playsinline muted></video>
  <div id="stats">Ready.</div>
  <script src="./renderer.bundle.js"></script>
</body>
</html>
